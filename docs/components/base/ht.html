<article id="ht" class="ht">
    <div class="group_title">
        <h2 class="subtitle">
            ht (_base.scscs)
        </h2>
        <h3 class="attribute">
            Tipo: Mixin
        </h3>
        <h3 class="attribute">
            Versión: 2.x.x
        </h3>
    </div>

    <p class="description">Oculta el texto (hide text).</p>

    <section class="use">
        <h2 class="title">
            Interface
        </h2>

        <pre class="language-scss"><code>@mixin ht;</code></pre>

        <h2 class="title">
            Ejemplo
        </h2>
        <div
            id="ht_example_tabs"
            class="container_example tab_panel"
            data-tab-panel
            data-active-tab="result"
        >
            <div class="tab_panel_list" data-tab-panel-list>
                <button class="tab_panel_tab" data-tab-panel-tab="result">Resultado</button>
                <button class="tab_panel_tab" data-tab-panel-tab="scss">SCSS</button>
                <button class="tab_panel_tab" data-tab-panel-tab="css">CSS generado</button>
                <button class="tab_panel_tab" data-tab-panel-tab="html">HTML</button>
            </div>

            <div class="tab_panel_panel" data-tab-panel-panel="result">
                <div class="result">
                    <p class="ht_example">Texto oculto</p>
                </div>
            </div>

            <div class="tab_panel_panel" data-tab-panel-panel="scss">
                <pre class="language-scss" data-src="../assets/scss/bases/ht.scss"></pre>
            </div>

            <div class="tab_panel_panel" data-tab-panel-panel="css">
                <pre class="language-css" data-src="../assets/css/bases/ht.css"></pre>
            </div>

            <div class="tab_panel_panel" data-tab-panel-panel="html">
                <pre class="language-html"><code>&lt;p&nbsp;class=&quot;ht_example&quot;&gt;Texto&nbsp;oculto&lt;/p&gt;</code></pre>
            </div>
        </div>
    </section>
</article>
