<header id="main_header" class="main_header layout_header">
    <div class="left_header b1">
        <a class="logo_sisass" href="/">
            SISASS Simple Interface for SASS
        </a>
        <div class="separator"> </div>
        <h3 class="slogan">
            Simple Interface for SASS
        </h3>
    </div>

    <div class="page_search b2">
        <button
            id="openclose_search"
            class="openclose icon_search"
            type="button"
            aria-label="Abrir buscador"
            >
        </button>

        <div class="container_search">
            <label class="page_search_label" for="page_search_input">
                Buscar en esta página
            </label>
            <div class="page_search_box">
                <input
                    id="page_search_input"
                    class="page_search_input"
                    type="search"
                    aria-label="Buscar en la documentación"
                    placeholder="Buscar en la documentación..."
                    autocomplete="off"
                    spellcheck="false"
                    />
                <kbd class="page_search_shortcut" aria-hidden="true">⌘ K</kbd>
            </div>
            <div id="page_search_results" class="page_search_results" aria-live="polite"></div>
        </div>
    </div>

    <div class="tools_header b3">
        <div id="theme_toggle_mount" class="theme_toggle_mount"></div>

        <div class="separator"></div>

        <h3 class="version">
            V2.0.0
        </h3>

        <div class="separator"></div>

        <div class="contact">
            <a class="github" href="https://github.com/esutoraiki/sisass/issues" target="_blank" rel="noopener noreferrer">
                <span class="logo_github"></span>
            </a>
            <a class="email" href="mailto:esutoraiki@gmail.com?subject=SISASS: documentation page" target="_blank" rel="noopener noreferrer">
                <span class="icon_email"></span>
            </a>
        </div>

    </div>
</header>
