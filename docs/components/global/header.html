<header id="main_header" class="main_header layout_header">
    <div class="left_header b1">
        <a class="logo_sisass" href="/">
            SISASS Simple Interface for SASS
        </a>
        <div class="separator"> </div>
        <h3 class="slogan">
            Simple Interface for SASS
        </h3>
    </div>

    <svg
        viewBox="0 0 125.496 117.13"
        id="menu_close"
        class="menu_close"
        role="button"
        tabindex="0"
        aria-controls="container_menu"
        aria-expanded="false"
        aria-label="Abrir navegación"
        >
        <g fill="none" stroke-width=".265" class="mc">
            <path class="mc1" d="M8.175 88.432h92.573c21.093 0 19.59-63.608 9.713-69.337-9.877-5.728-13.79 2.715-21.4 9.6l-80.886 80.18z"/>
            <path class="mc2" d="M8.07 28.698h92.573c21.092 0 19.59 63.609 9.713 69.337-9.877 5.729-13.79-2.714-21.401-9.6L8.07 8.255z"/>
            <path class="mc3" d="M8.294 58.542h101.623"/>
        </g>
    </svg>

    <div class="page_search b2">
        <button id="openclose_search" class="openclose icon_search">
        </button>

        <div class="container_search">
            <label class="page_search_label" for="page_search_input">
                Buscar en esta página
            </label>
            <div class="page_search_box">
                <input
                    id="page_search_input"
                    class="page_search_input"
                    type="search"
                    placeholder="Buscar contenido, mixins, claves o descripciones"
                    autocomplete="off"
                    spellcheck="false"
                    />
            </div>
            <div id="page_search_results" class="page_search_results" aria-live="polite"></div>
        </div>
    </div>

    <div class="tools_header b3">
        <button id="theme_toggle" class="theme_toggle" type="button" aria-label="Cambiar tema" >
            <span class="icon_light hide"></span>
            <span class="icon_dark"></span>
        </button>
    </div>
</header>
